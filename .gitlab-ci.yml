workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - verify
  - build
  - scan
  - db-gates
  - deploy
  - notify

variables:
  KUBE_NAMESPACE: "nexus-prod"
  PUBLIC_HOST: "nexus.youdoogo.com"
  PUBLIC_PREFIX: "/scoringsys"
  CCE_ELB_ID: "abab7533-a1c6-4138-a4bc-59d53e3446e2"
  CCE_LISTENER_MASTER_INGRESS: "nexus-prod/nexus-studio"
  CCE_TLS_CERTIFICATE_IDS: "56de20421757445ea53f5af51ecb4e10"
  CCE_INGRESS_CLASS: "cce"
  DOCKER_HOST: "unix:///runner-docker.sock"

default:
  tags:
    - AI

verify-app:
  stage: verify
  image: node:20-alpine
  variables:
    # Keep the npm download cache inside the project directory so GitLab can
    # carry it between pipelines. Job 14108 spent most of its 433s re-fetching
    # the same 46 packages the image build had already downloaded.
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  script:
    # --prefer-offline reuses the restored cache; it never relaxes the lockfile
    # check, so `npm ci` still fails on a package-lock.json/package.json drift.
    - npm ci --prefer-offline --no-audit --no-fund
    - npm test
    - npm run build

verify-delivery-contract:
  stage: verify
  image: python:3.12-slim
  script:
    - python -m pip install --disable-pip-version-check --no-cache-dir pyyaml
    - python tests/test_cce_delivery_contract.py

ci-lint:
  stage: verify
  image: curlimages/curl:8.10.1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  script:
    - |
      if [ -z "${CI_API_V4_URL:-}" ] || [ -z "${CI_PROJECT_ID:-}" ] || [ -z "${CI_JOB_TOKEN:-}" ]; then
        echo "GitLab CI Lint API is unavailable; offline delivery contract remains required"
        exit 0
      fi

      # The project-level endpoint accepts the CI job token and keeps linting
      # scoped to this repository. The offline delivery contract remains the
      # deterministic gate when the API is unavailable to the runner.
      lint_endpoint="${CI_API_V4_URL%/}/projects/${CI_PROJECT_ID}/ci/lint"
      lint_body=$(mktemp)
      trap 'rm -f "$lint_body"' EXIT
      lint_status=$(curl --silent --show-error --request POST \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --form "content=<.gitlab-ci.yml" \
        --output "$lint_body" \
        --write-out '%{http_code}' \
        "$lint_endpoint" 2>/dev/null) || {
        echo "GitLab CI Lint API is unavailable; offline delivery contract remains required" >&2
        exit 0
      }

      compact_response=$(tr -d '[:space:]' < "$lint_body")
      case "$compact_response" in
        *'"valid":false,'*|*'"valid":false}'*)
          echo "GitLab CI Lint rejected .gitlab-ci.yml" >&2
          exit 1
          ;;
      esac

      case "$lint_status" in
        2??) ;;
        *)
          echo "GitLab CI Lint API is unavailable (HTTP $lint_status); offline delivery contract remains required" >&2
          exit 0
          ;;
      esac

      case "$compact_response" in
        *'"valid":true,'*|*'"valid":true}'*) ;;
        *) echo "GitLab CI Lint rejected .gitlab-ci.yml" >&2; exit 1 ;;
      esac

render-cce:
  stage: verify
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - python -m pip install --disable-pip-version-check --no-cache-dir pyyaml
    - ': "${SWR_REGION:?SWR_REGION is required}"'
    - ': "${KUBE_IMAGE_PULL_SECRET:?KUBE_IMAGE_PULL_SECRET is required}"'
    - ': "${RUNTIME_SECRET_NAME:?RUNTIME_SECRET_NAME is required}"'
    - ': "${POSTGRES_SERVICE_NAME:?POSTGRES_SERVICE_NAME is required}"'
    - ': "${POSTGRES_POD_LABEL_KEY:?POSTGRES_POD_LABEL_KEY is required}"'
    - ': "${POSTGRES_POD_LABEL_VALUE:?POSTGRES_POD_LABEL_VALUE is required}"'
    - export SWR_REGISTRY="${SWR_REGISTRY_OVERRIDE:-swr.${SWR_REGION}.myhuaweicloud.com}"
    - export IMAGE_REFERENCE="${SWR_REGISTRY}/scoringsys:${CI_COMMIT_SHA}"
    - python scripts/ci/render_cce.py --output-dir .rendered/cce
  artifacts:
    expire_in: 1 day
    paths:
      - .rendered/cce/

migrate-db:
  stage: db-gates
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
  when: manual
  allow_failure: false
  retry: 0
  interruptible: false
  resource_group: scoringsys-db-mutation
  needs:
    - job: render-cce
      artifacts: true
    - job: build-image
    - job: scan-image
  before_script:
    - apk add --no-cache ca-certificates kubectl
  script:
    # A production DB mutation is never implicit. The manual action must carry
    # an explicit approval variable and a migrator Secret already created by
    # the cluster administrator; this job never creates or prints either one.
    - ': "${PRODUCTION_DB_MUTATION_APPROVED:?set PRODUCTION_DB_MUTATION_APPROVED=true to run a production DB mutation}"'
    - '[ "$PRODUCTION_DB_MUTATION_APPROVED" = true ] || { echo "production DB mutation is not approved" >&2; exit 1; }'
    - ': "${KUBECONFIG_CCE_B64:?KUBECONFIG_CCE_B64 is required}"'
    - ': "${MIGRATOR_SECRET_NAME:?MIGRATOR_SECRET_NAME is required}"'
    - printf '%s' "$KUBECONFIG_CCE_B64" | base64 -d > kubeconfig
    - export KUBECONFIG="$CI_PROJECT_DIR/kubeconfig"
    - trap 'rm -f "$KUBECONFIG"' EXIT
    - kubectl -n "$KUBE_NAMESPACE" get secret "$MIGRATOR_SECRET_NAME" >/dev/null
    - kubectl -n "$KUBE_NAMESPACE" create --dry-run=server -f .rendered/cce/job-migrate.yaml >/dev/null
    - kubectl -n "$KUBE_NAMESPACE" create -f .rendered/cce/job-migrate.yaml
    - kubectl -n "$KUBE_NAMESPACE" wait --for=condition=complete job/scoringsys-migrate --timeout=1800s

import-db:
  stage: db-gates
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
  when: manual
  allow_failure: false
  retry: 0
  interruptible: false
  resource_group: scoringsys-db-mutation
  needs:
    - job: render-cce
      artifacts: true
    - job: build-image
    - job: scan-image
    - job: migrate-db
  before_script:
    - apk add --no-cache ca-certificates kubectl jq
  script:
    # Import is a separate, explicit gate. Snapshot bytes are supplied at run
    # time; they are not committed, put in an image, or stored in a ConfigMap.
    - ': "${PRODUCTION_DB_MUTATION_APPROVED:?set PRODUCTION_DB_MUTATION_APPROVED=true to run a production DB mutation}"'
    - '[ "$PRODUCTION_DB_MUTATION_APPROVED" = true ] || { echo "production DB mutation is not approved" >&2; exit 1; }'
    - ': "${KUBECONFIG_CCE_B64:?KUBECONFIG_CCE_B64 is required}"'
    - ': "${MIGRATOR_SECRET_NAME:?MIGRATOR_SECRET_NAME is required}"'
    - ': "${SNAPSHOT_FILE:?SNAPSHOT_FILE must point to an operator-provided snapshot}"'
    - ': "${MANIFEST_FILE:?MANIFEST_FILE must point to an operator-provided manifest}"'
    - test -s "$SNAPSHOT_FILE"
    - test -s "$MANIFEST_FILE"
    - jq -e 'type == "object" and (.tables | type == "object")' "$SNAPSHOT_FILE" >/dev/null
    - jq -e 'type == "object" and (.table_count == 16) and (.row_count | type == "number") and (.tables | type == "object") and (.errors | type == "array" and length == 0)' "$MANIFEST_FILE" >/dev/null
    - printf '%s' "$KUBECONFIG_CCE_B64" | base64 -d > kubeconfig
    - export KUBECONFIG="$CI_PROJECT_DIR/kubeconfig"
    - trap 'rm -f "$KUBECONFIG"' EXIT
    - kubectl -n "$KUBE_NAMESPACE" get secret "$MIGRATOR_SECRET_NAME" >/dev/null
    - kubectl -n "$KUBE_NAMESPACE" create --dry-run=server -f .rendered/cce/job-import.yaml >/dev/null
    # Validate the reviewed Job shape, then stream bytes into a one-shot Pod.
    # The Pod is removed by --rm, so the snapshot never lands in a ConfigMap,
    # Secret, image layer, or long-lived Kubernetes object.
    - |
      set -eu -o pipefail
      [[ "$MIGRATOR_SECRET_NAME" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]] || { echo "MIGRATOR_SECRET_NAME is not DNS-compatible" >&2; exit 1; }
      pod_name="scoringsys-import-${CI_PIPELINE_ID:-manual}-${CI_JOB_ID:-run}"
      [[ "$pod_name" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ && ${#pod_name} -le 63 ]] || { echo "generated import Pod name is not DNS-compatible" >&2; exit 1; }
      jq -cn --slurpfile snapshot "$SNAPSHOT_FILE" --slurpfile manifest "$MANIFEST_FILE" \
        '{snapshot: $snapshot[0], manifest: $manifest[0]}' |
        kubectl -n "$KUBE_NAMESPACE" run "$pod_name" --rm -i --restart=Never \
          --image="$IMAGE_REFERENCE" \
          --overrides="{\"apiVersion\":\"v1\",\"spec\":{\"automountServiceAccountToken\":false,\"securityContext\":{\"runAsNonRoot\":true,\"seccompProfile\":{\"type\":\"RuntimeDefault\"}},\"containers\":[{\"name\":\"$pod_name\",\"envFrom\":[{\"secretRef\":{\"name\":\"$MIGRATOR_SECRET_NAME\"}}],\"securityContext\":{\"allowPrivilegeEscalation\":false,\"readOnlyRootFilesystem\":true,\"runAsNonRoot\":true,\"runAsUser\":1000,\"runAsGroup\":1000,\"capabilities\":{\"drop\":[\"ALL\"]}},\"resources\":{\"requests\":{\"cpu\":\"100m\",\"memory\":\"256Mi\"},\"limits\":{\"cpu\":\"500m\",\"memory\":\"512Mi\"}},\"volumeMounts\":[{\"name\":\"tmp\",\"mountPath\":\"/tmp\"}]}],\"volumes\":[{\"name\":\"tmp\",\"emptyDir\":{}}]}}" \
          --command -- node scripts/db/import-snapshot.mjs --force --file -

build-image:
  stage: build
  image: docker:27-cli
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    # Per-job builder. A shared name bought nothing: in jobs 14147 and 14164
    # `docker buildx create --name scoringsys-ci` succeeded outright with a
    # fresh Last Activity instead of reporting an existing instance, so the
    # builder does not survive between jobs on this runner. Isolating it also
    # avoids concurrent jobs sharing one buildkitd and its config.
    BUILDX_BUILDER: "scoringsys-ci-${CI_JOB_ID}"
    BUILDKITD_CONFIG: "$CI_PROJECT_DIR/.buildkitd.toml"
    # The cross-pipeline cache lives in SWR instead, which is authenticated and
    # proven reachable (login, push and the Trivy pull all succeed there). This
    # tag is deliberately distinct from the immutable commit tag.
    BUILD_CACHE_TAG: "buildcache-${CI_COMMIT_REF_SLUG}"
  script:
    - ': "${SWR_REGION:?SWR_REGION is required}"'
    - ': "${SWR_AK:?SWR_AK is required}"'
    - ': "${SWR_PASSWORD:?SWR_PASSWORD is required}"'
    - export SWR_REGISTRY="${SWR_REGISTRY_OVERRIDE:-swr.${SWR_REGION}.myhuaweicloud.com}"
    - export SWR_REGISTRY_HOST="${SWR_REGISTRY%%/*}"
    - export DOCKER_CONFIG="$(mktemp -d)"
    - trap 'rm -rf "$DOCKER_CONFIG"' EXIT
    - printf '%s' "$SWR_PASSWORD" | docker login "$SWR_REGISTRY_HOST" --username "${SWR_REGION}@${SWR_AK}" --password-stdin
    - |
      cat > "$BUILDKITD_CONFIG" <<'EOF'
      [registry."docker.io"]
        mirrors = ["docker.m.daocloud.io", "mirror.ccs.tencentyun.com", "hub-mirror.c.163.com"]
      EOF
    - export BUILD_CACHE_REF="${SWR_REGISTRY}/scoringsys:${BUILD_CACHE_TAG}"
    - docker buildx create --name "$BUILDX_BUILDER" --driver docker-container --buildkitd-config "$BUILDKITD_CONFIG" --use
    - docker buildx inspect --bootstrap
    - |
      # No --pull: it forces a fresh base-image resolution. But --pull was only
      # part of it -- job 14164 fell through the configured mirrors to
      # registry-1.docker.io without --pull too. Jobs 14147 and 14164 hit
      # different blocked addresses (108.160.167.159, 162.125.32.13) while job
      # 14139 resolved the same tag in 2.3s, so the mirror path is
      # intermittent. Retry the whole build at most twice; never mask a
      # failure. APK_UPGRADE_DATE still busts the apk upgrade layer daily and
      # scan-image remains the blocking gate on any base-image CVE.
      build_image() {
        docker buildx build --platform linux/amd64 --provenance=false --push \
          --build-arg "APK_UPGRADE_DATE=$(date -u +%Y-%m-%d)" \
          --cache-from "type=registry,ref=${BUILD_CACHE_REF}" \
          --cache-to "type=registry,ref=${BUILD_CACHE_REF},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true" \
          --tag "${SWR_REGISTRY}/scoringsys:${CI_COMMIT_SHA}" .
      }

      attempt=1
      build_ok=""
      while [ "$attempt" -le 2 ]; do
        echo "docker buildx build (attempt ${attempt}/2)"
        if build_image; then
          build_ok=yes
          break
        fi
        if [ "$attempt" -lt 2 ]; then
          echo "Build failed; retrying in 10s" >&2
          sleep 10
        fi
        attempt=$((attempt + 1))
      done

      if [ -z "$build_ok" ]; then
        echo "docker buildx build failed after 2 attempts" >&2
        exit 1
      fi
    - docker logout "$SWR_REGISTRY_HOST" >/dev/null 2>&1 || true
  after_script:
    - docker buildx rm "${BUILDX_BUILDER:-}" >/dev/null 2>&1 || true
    - rm -f "${BUILDKITD_CONFIG:-}" >/dev/null 2>&1 || true

scan-image:
  stage: scan
  image:
    name: aquasec/trivy:0.56.2
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs:
    - job: build-image
  cache:
    key: "trivy-0.56.2-db-v2"
    # Keep protected and non-protected jobs on the same logical key. Cache is
    # only an accelerator; the bounded DB acquisition below is always run.
    unprotect: true
    paths:
      - .trivycache/
    policy: pull-push
    when: always
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache"
    TRIVY_DB_DOWNLOAD_TIMEOUT: "5m"
    # This source is proven reachable from the shared AI runner. A protected
    # CI variable with the same name may override it when needed.
    TRIVY_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-db:2"
  script:
    - ': "${SWR_REGION:?SWR_REGION is required}"'
    - ': "${SWR_AK:?SWR_AK is required}"'
    - ': "${SWR_PASSWORD:?SWR_PASSWORD is required}"'
    - export SWR_REGISTRY="${SWR_REGISTRY_OVERRIDE:-swr.${SWR_REGION}.myhuaweicloud.com}"
    - unset TRIVY_USERNAME TRIVY_PASSWORD
    - |
      cleanup_trivy_db_partial() {
        db_dir="$TRIVY_CACHE_DIR/db"
        [ -d "$db_dir" ] || return 0
        # Keep valid trivy.db and metadata.json cache entries intact; remove
        # only temporary/partial entries from Trivy's db cache directory.
        find "$db_dir" -maxdepth 1 -type f \( \
          -name 'trivy.db.tmp' -o -name 'metadata.json.tmp' -o -name '*.part' \
        \) -delete
      }

      download_trivy_db() {
        repository="$TRIVY_DB_REPOSITORY"
        attempt=1
        while [ "$attempt" -le 2 ]; do
          echo "Downloading Trivy vulnerability DB from ${repository} (attempt ${attempt}/2)"
          if TRIVY_DB_REPOSITORY="$repository" trivy image \
            --download-db-only \
            --cache-dir "$TRIVY_CACHE_DIR" \
            --timeout "$TRIVY_DB_DOWNLOAD_TIMEOUT"; then
            return 0
          fi
          cleanup_trivy_db_partial
          if [ "$attempt" -lt 2 ]; then
            sleep 2
          fi
          attempt=$((attempt + 1))
        done
        return 1
      }

      export TRIVY_DB_REPOSITORY="${TRIVY_DB_REPOSITORY:-public.ecr.aws/aquasecurity/trivy-db:2}"
      if ! download_trivy_db; then
        echo "Unable to download the Trivy vulnerability DB after 2 attempts" >&2
        exit 1
      fi
    - export TRIVY_USERNAME="${SWR_REGION}@${SWR_AK}"
    - export TRIVY_PASSWORD="$SWR_PASSWORD"
    - trivy image --severity HIGH,CRITICAL --exit-code 1 --cache-dir "$TRIVY_CACHE_DIR" --skip-db-update --skip-java-db-update "${SWR_REGISTRY}/scoringsys:${CI_COMMIT_SHA}"

deploy-cce:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs:
    - job: render-cce
      artifacts: true
    - job: build-image
    - job: scan-image
    - job: migrate-db
    - job: import-db
  retry: 0
  interruptible: false
  resource_group: scoringsys-cce
  environment:
    name: production
  before_script:
    - apk add --no-cache bash ca-certificates curl kubectl python3
  script:
    - export SWR_REGISTRY="${SWR_REGISTRY_OVERRIDE:-swr.${SWR_REGION}.myhuaweicloud.com}"
    - export IMAGE_REFERENCE="${SWR_REGISTRY}/scoringsys:${CI_COMMIT_SHA}"
    - scripts/ci/deploy-cce.sh

notify-failure:
  stage: notify
  image: python:3.12-alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"'
    - when: never
  when: on_failure
  allow_failure: true
  script:
    - ': "${FEISHU_APP_ID:?FEISHU_APP_ID is required}"'
    - ': "${FEISHU_APP_SECRET:?FEISHU_APP_SECRET is required}"'
    - ': "${FEISHU_CHAT_ID:?FEISHU_CHAT_ID is required}"'
    - python3 scripts/ci/notify_feishu.py --status failure

notify-success:
  stage: notify
  image: python:3.12-alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"'
    - when: never
  when: on_success
  allow_failure: true
  needs:
    - job: deploy-cce
  script:
    - ': "${FEISHU_APP_ID:?FEISHU_APP_ID is required}"'
    - ': "${FEISHU_APP_SECRET:?FEISHU_APP_SECRET is required}"'
    - ': "${FEISHU_CHAT_ID:?FEISHU_CHAT_ID is required}"'
    - python3 scripts/ci/notify_feishu.py --status success
