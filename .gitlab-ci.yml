workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - verify
  - build
  - scan
  - deploy
  - notify

variables:
  KUBE_NAMESPACE: "nexus-prod"
  PUBLIC_HOST: "nexus.youdoogo.com"
  PUBLIC_PREFIX: "/scoringsys"
  CCE_ELB_ID: "abab7533-a1c6-4138-a4bc-59d53e3446e2"
  CCE_LISTENER_MASTER_INGRESS: "nexus-prod/nexus-studio"
  CCE_TLS_CERTIFICATE_IDS: "56de20421757445ea53f5af51ecb4e10"
  CCE_INGRESS_CLASS: "cce"
  DOCKER_HOST: "unix:///runner-docker.sock"

default:
  tags:
    - AI

verify-app:
  stage: verify
  image: node:20-alpine
  variables:
    # Keep the npm download cache inside the project directory so GitLab can
    # carry it between pipelines. Job 14108 spent most of its 433s re-fetching
    # the same 46 packages the image build had already downloaded.
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  script:
    # --prefer-offline reuses the restored cache; it never relaxes the lockfile
    # check, so `npm ci` still fails on a package-lock.json/package.json drift.
    - npm ci --prefer-offline --no-audit --no-fund
    - npm test
    - npm run build

verify-delivery-contract:
  stage: verify
  image: python:3.12-slim
  script:
    - python -m pip install --disable-pip-version-check --no-cache-dir pyyaml
    - python tests/test_cce_delivery_contract.py

render-cce:
  stage: verify
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - python -m pip install --disable-pip-version-check --no-cache-dir pyyaml
    - ': "${SWR_REGION:?SWR_REGION is required}"'
    - ': "${KUBE_IMAGE_PULL_SECRET:?KUBE_IMAGE_PULL_SECRET is required}"'
    - export SWR_REGISTRY="${SWR_REGISTRY_OVERRIDE:-swr.${SWR_REGION}.myhuaweicloud.com}"
    - export IMAGE_REFERENCE="${SWR_REGISTRY}/scoringsys:${CI_COMMIT_SHA}"
    - python scripts/ci/render_cce.py --output-dir .rendered/cce
  artifacts:
    expire_in: 1 day
    paths:
      - .rendered/cce/

build-image:
  stage: build
  image: docker:27-cli
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    # A stable builder name keeps the BuildKit layer cache alive across
    # pipelines. With the previous per-job name the builder was created and
    # torn down every run, so job 14117 rebuilt `npm ci` from zero (737s of a
    # 941s job). Base-image freshness is handled by APK_UPGRADE_DATE below
    # plus the Trivy gate in scan-image; see CI_SPEED_REPORT.md.
    BUILDX_BUILDER: "scoringsys-ci"
    BUILDKITD_CONFIG: "$CI_PROJECT_DIR/.buildkitd.toml"
  script:
    - ': "${SWR_REGION:?SWR_REGION is required}"'
    - ': "${SWR_AK:?SWR_AK is required}"'
    - ': "${SWR_PASSWORD:?SWR_PASSWORD is required}"'
    - export SWR_REGISTRY="${SWR_REGISTRY_OVERRIDE:-swr.${SWR_REGION}.myhuaweicloud.com}"
    - export SWR_REGISTRY_HOST="${SWR_REGISTRY%%/*}"
    - export DOCKER_CONFIG="$(mktemp -d)"
    - trap 'rm -rf "$DOCKER_CONFIG"' EXIT
    - printf '%s' "$SWR_PASSWORD" | docker login "$SWR_REGISTRY_HOST" --username "${SWR_REGION}@${SWR_AK}" --password-stdin
    - |
      cat > "$BUILDKITD_CONFIG" <<'EOF'
      [registry."docker.io"]
        mirrors = ["docker.m.daocloud.io", "mirror.ccs.tencentyun.com", "hub-mirror.c.163.com"]
      EOF
    - |
      docker buildx create --name "$BUILDX_BUILDER" --driver docker-container \
        --buildkitd-config "$BUILDKITD_CONFIG" --use \
        || docker buildx use "$BUILDX_BUILDER"
    - docker buildx inspect --bootstrap
    # No --pull here: it forced a fresh registry resolution of the base image
    # that fell through the configured mirrors to registry-1.docker.io, which
    # this runner cannot reach (job 14147: "dial tcp 108.160.167.159:443:
    # connect: connection refused"). APK_UPGRADE_DATE still busts the apk
    # upgrade layer once a day so OpenSSL patches keep landing, and scan-image
    # remains the blocking gate on any base-image CVE.
    - docker buildx build --platform linux/amd64 --provenance=false --push --build-arg "APK_UPGRADE_DATE=$(date -u +%Y-%m-%d)" --tag "${SWR_REGISTRY}/scoringsys:${CI_COMMIT_SHA}" .
    - docker logout "$SWR_REGISTRY_HOST" >/dev/null 2>&1 || true
  after_script:
    # The builder is deliberately kept so its layer cache survives the job.
    # buildkitd's own GC policy bounds the disk it may use.
    - rm -f "${BUILDKITD_CONFIG:-}" >/dev/null 2>&1 || true

scan-image:
  stage: scan
  image:
    name: aquasec/trivy:0.56.2
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs:
    - job: build-image
  cache:
    key: "trivy-0.56.2-db-v2"
    # Keep protected and non-protected jobs on the same logical key. Cache is
    # only an accelerator; the bounded DB acquisition below is always run.
    unprotect: true
    paths:
      - .trivycache/
    policy: pull-push
    when: always
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache"
    TRIVY_DB_DOWNLOAD_TIMEOUT: "5m"
    # This source is proven reachable from the shared AI runner. A protected
    # CI variable with the same name may override it when needed.
    TRIVY_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-db:2"
  script:
    - ': "${SWR_REGION:?SWR_REGION is required}"'
    - ': "${SWR_AK:?SWR_AK is required}"'
    - ': "${SWR_PASSWORD:?SWR_PASSWORD is required}"'
    - export SWR_REGISTRY="${SWR_REGISTRY_OVERRIDE:-swr.${SWR_REGION}.myhuaweicloud.com}"
    - unset TRIVY_USERNAME TRIVY_PASSWORD
    - |
      cleanup_trivy_db_partial() {
        db_dir="$TRIVY_CACHE_DIR/db"
        [ -d "$db_dir" ] || return 0
        # Keep valid trivy.db and metadata.json cache entries intact; remove
        # only temporary/partial entries from Trivy's db cache directory.
        find "$db_dir" -maxdepth 1 -type f \( \
          -name 'trivy.db.tmp' -o -name 'metadata.json.tmp' -o -name '*.part' \
        \) -delete
      }

      download_trivy_db() {
        repository="$TRIVY_DB_REPOSITORY"
        attempt=1
        while [ "$attempt" -le 2 ]; do
          echo "Downloading Trivy vulnerability DB from ${repository} (attempt ${attempt}/2)"
          if TRIVY_DB_REPOSITORY="$repository" trivy image \
            --download-db-only \
            --cache-dir "$TRIVY_CACHE_DIR" \
            --timeout "$TRIVY_DB_DOWNLOAD_TIMEOUT"; then
            return 0
          fi
          cleanup_trivy_db_partial
          if [ "$attempt" -lt 2 ]; then
            sleep 2
          fi
          attempt=$((attempt + 1))
        done
        return 1
      }

      export TRIVY_DB_REPOSITORY="${TRIVY_DB_REPOSITORY:-public.ecr.aws/aquasecurity/trivy-db:2}"
      if ! download_trivy_db; then
        echo "Unable to download the Trivy vulnerability DB after 2 attempts" >&2
        exit 1
      fi
    - export TRIVY_USERNAME="${SWR_REGION}@${SWR_AK}"
    - export TRIVY_PASSWORD="$SWR_PASSWORD"
    - trivy image --severity HIGH,CRITICAL --exit-code 1 --cache-dir "$TRIVY_CACHE_DIR" --skip-db-update --skip-java-db-update "${SWR_REGISTRY}/scoringsys:${CI_COMMIT_SHA}"

deploy-cce:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs:
    - job: render-cce
      artifacts: true
    - job: build-image
    - job: scan-image
  retry: 0
  interruptible: false
  resource_group: scoringsys-cce
  environment:
    name: production
  before_script:
    - apk add --no-cache bash ca-certificates curl kubectl python3
  script:
    - export SWR_REGISTRY="${SWR_REGISTRY_OVERRIDE:-swr.${SWR_REGION}.myhuaweicloud.com}"
    - export IMAGE_REFERENCE="${SWR_REGISTRY}/scoringsys:${CI_COMMIT_SHA}"
    - scripts/ci/deploy-cce.sh

notify-failure:
  stage: notify
  image: python:3.12-alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"'
    - when: never
  when: on_failure
  allow_failure: true
  script:
    - ': "${FEISHU_APP_ID:?FEISHU_APP_ID is required}"'
    - ': "${FEISHU_APP_SECRET:?FEISHU_APP_SECRET is required}"'
    - ': "${FEISHU_CHAT_ID:?FEISHU_CHAT_ID is required}"'
    - python3 scripts/ci/notify_feishu.py --status failure

notify-success:
  stage: notify
  image: python:3.12-alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"'
    - when: never
  when: on_success
  allow_failure: true
  needs:
    - job: deploy-cce
  script:
    - ': "${FEISHU_APP_ID:?FEISHU_APP_ID is required}"'
    - ': "${FEISHU_APP_SECRET:?FEISHU_APP_SECRET is required}"'
    - ': "${FEISHU_CHAT_ID:?FEISHU_CHAT_ID is required}"'
    - python3 scripts/ci/notify_feishu.py --status success
